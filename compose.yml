services:
  postgres:
    image: postgres:18
    container_name: medverify-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: medverify_identity

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - medverify_postgres_data:/var/lib/postgresql

volumes:
  medverify_postgres_data: