spring:
  application:
    name: provider-registry-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medverify_provider}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8086

npi:
  registry:
    base-url: https://npiregistry.cms.hhs.gov/api

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never